# pipeline configuration for NYC taxi ELT exercises
name: nyc-taxi
schedule: "daily"
start_date: "2022-01-01"

# connection shortcuts for local development
default_connections:
  duckdb: duckdb-default

# variables available to assets
variables:
  taxi_types:
    type: array
    items:
      type: string
    default: ["yellow", "green"]
